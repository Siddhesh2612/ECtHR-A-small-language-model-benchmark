[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecthr-benchmark"
version = "0.1.0"
description = "Reproducible ECtHR-A data preparation and language-model fine-tuning, with an MSc experiment archive"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Siddhesh Jadhav"}]
keywords = ["ECtHR-A", "LexGLUE", "legal NLP", "small language models", "reproducible research"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Siddhesh2612/ECtHR-A-small-language-model-benchmark"
Issues = "https://github.com/Siddhesh2612/ECtHR-A-small-language-model-benchmark/issues"

[project.optional-dependencies]
data = ["pyarrow==25.0.1"]
train = ["torch==2.8.0", "transformers==4.56.2", "accelerate==1.10.1", "numpy==2.2.6"]
lora = ["peft==0.17.1"]
qlora = ["peft==0.17.1", "bitsandbytes==0.50.2"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
